name: Petstore Pipeline

# Trigger the workflow on push or pull request to main branch
on:
  push:
    branches:
      - main
  workflow_dispatch:     
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest  

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  

    - name: Set up JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: '8'  
        distribution: 'adoptopenjdk'

    - name: Cache Maven dependencies
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository  
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}  
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Install dependencies
      run: mvn install -DskipTests=true  

    - name: Run Tests with Maven
      run: mvn test  
      continue-on-error: false  

    - name: Upload Cucumber HTML Report as an artifact
      if: success()  
      uses: actions/upload-artifact@v2
      with:
        name: cucumber-reports
        path: target/cucumber/report.html  

    - name: Upload JUnit Report as an artifact
      if: success()
      uses: actions/upload-artifact@v2
      with:
        name: junit-reports
        path: target/surefire-reports/  

    - name: Clean up the workspace
      if: always()
      run: mvn clean  