name: Petstore Pipeline

# Trigger the workflow on push or pull request to main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest  # Specifies the environment to run the job

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checkout the repository code

    - name: Set up JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: '8'  # Specify Java version, this assumes JDK 8
        distribution: 'adoptopenjdk'

    - name: Cache Maven dependencies
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository  # Caches the local Maven repository to speed up future builds
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}  # Cache key is based on the hash of the pom.xml files
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Install dependencies
      run: mvn install -DskipTests=true  # Install dependencies without running tests

    - name: Run Tests with Maven
      run: mvn test  # Run tests using Maven
      continue-on-error: false  # Fail the build if the tests fail

    - name: Upload Cucumber HTML Report as an artifact
      if: success()  # This step will only run if the tests succeed
      uses: actions/upload-artifact@v2
      with:
        name: cucumber-reports
        path: target/cucumber/report.html  # Upload the HTML report as an artifact

    - name: Upload JUnit Report as an artifact
      if: success()
      uses: actions/upload-artifact@v2
      with:
        name: junit-reports
        path: target/surefire-reports/  # Upload the JUnit report as an artifact

    - name: Clean up the workspace
      if: always()
      run: mvn clean  # Clean up after the build