# Enable parallel execution of tests
junit.jupiter.execution.parallel.enabled=true

# Set the default parallelism mode (default is fixed)
junit.jupiter.execution.parallel.mode.default=concurrent

# Optionally, set the concurrency level (number of threads for running tests)
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Optionally, configure the mode for tests and test classes
# Mode for tests and classes can be "concurrent" (parallel test execution) or "same_thread" (sequential execution)
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.mode.tests.default=same_thread